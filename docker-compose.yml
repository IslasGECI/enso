services:
  islasgeci:
    build:
      context: .
      dockerfile: Dockerfile
    image: islasgeci/enso:latest
    command: bash
    volumes:
      - $PWD:/workdir

  develop:
    profiles: ["develop"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: islasgeci/enso:develop
    command: bash
    volumes:
      - $PWD:/workdir
