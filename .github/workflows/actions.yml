name: Tests
on: push
jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
    - name: Copia repositorio
      uses: actions/checkout@main
    - name: Libera espacio en disco
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        large-packages: true
        docker-images: true
        swap-storage: true
    - name: Descarga imágenes
      run: docker compose --profile develop pull
    - name: Verifica el formato
      run: docker compose --profile develop run --rm develop make check
    - name: Corre pruebas y evalúa cobertura
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: >
        docker compose --profile develop run --rm
        -e CODECOV_TOKEN
        -e GITHUB_ACTION
        -e GITHUB_REPOSITORY
        -e GITHUB_REF
        -e GITHUB_HEAD_REF
        -e GITHUB_RUN_ID
        develop make coverage
    - name: Corre mutation testing
      run: docker compose --profile develop run --rm develop make mutants
    - name: Verify acceptance criteria
      run: bash .pipelines/verify.sh
